<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가을의 시간 · 스톱워치</title>
<style>
* { box-sizing: border-box; }
:root { color-scheme: light; }
body { margin: 0; min-height: 100vh; min-height: 100svh; padding: 32px 18px; display: grid; place-items: center; color: #40251e; font-family: "Malgun Gothic", system-ui, sans-serif; background: #93482c; isolation: isolate; }
.landscape { position: fixed; inset: 0; overflow: hidden; z-index: -1; background: radial-gradient(ellipse at 72% 24%, #fff4b7 0, #f5cd83 15%, transparent 48%), linear-gradient(#cc9865, #efd29b 55%, #a95a30); }
.sun { position: absolute; width: 170px; height: 170px; top: 13%; right: 20%; border-radius: 50%; background: #fff4c1; box-shadow: 0 0 100px 45px #ffdf9c9c; }
.hill { position: absolute; width: 140%; height: 48%; left: -20%; bottom: -18%; border-radius: 50%; background: #6b352a; transform: rotate(-9deg); }
.hill.back { bottom: -9%; left: 5%; background: #a5683f; transform: rotate(12deg); }
.tree { position: absolute; width: 20px; height: 84%; bottom: 0; background: linear-gradient(90deg, #4c2b23, #754631); transform: rotate(5deg); left: 7%; }
.tree::before, .tree::after { content: ""; position: absolute; width: 320px; height: 280px; border-radius: 45% 55% 55% 35%; top: -60px; left: -180px; background: #9b3e22; box-shadow: 110px 45px 0 #b55523, -80px 90px 0 #7c3b26, 40px -100px 0 #c16b24; }
.tree::after { width: 8px; height: 220px; left: 25px; top: 80px; background: #65412b; box-shadow: none; transform: rotate(36deg); border-radius: 0; }
.tree.right { left: auto; right: 4%; height: 100%; transform: rotate(-7deg); }
.tree.right::before { background: #ba6b27; box-shadow: -140px -30px 0 #d19332, 60px 75px 0 #aa4c25, -30px -120px 0 #b95821; }
.leaf { position: absolute; top: -60px; left: var(--left); width: 19px; height: 32px; border-radius: 2px 85% 2px 85%; background: var(--color); animation: drift var(--duration) linear infinite; animation-delay: var(--delay); opacity: .85; }
.leaf::after { content: ""; position: absolute; width: 1px; height: 30px; background: #6b352a80; top: 5px; left: 9px; transform: rotate(-30deg); }
@keyframes drift { from { transform: translate(-30px, -5vh) rotate(0); } 50% { transform: translate(65px, 55vh) rotate(190deg); } to { transform: translate(-15px, 115vh) rotate(380deg); } }
main { width: min(100%, 600px); padding: clamp(24px, 5vw, 48px); background: #fff8e9ed; border: 1px solid #fff2d6; border-radius: 24px; box-shadow: 0 22px 80px #4b241b50; backdrop-filter: blur(12px); }
h1 { margin: 0; font-family: "Batang", "Times New Roman", serif; font-size: clamp(1.7rem, 5vw, 2.25rem); font-weight: 500; letter-spacing: -.05em; }
.subtitle { color: #81593f; margin: 12px 0 32px; line-height: 1.7; }
#time { margin: 0 0 30px; text-align: center; white-space: nowrap; font: 500 clamp(1.5rem, 6.7vw, 3rem)/1.3 Consolas, monospace; letter-spacing: -.055em; font-variant-numeric: tabular-nums; }
#fraction { color: #a74c28; }
.controls { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 10px; }
button { font: 600 1rem system-ui, sans-serif; padding: 14px 6px; border: 1px solid #c8ad8b; border-radius: 10px; color: #593a29; background: #f8ecd8; cursor: pointer; transition: background .2s, transform .2s; }
button:hover:enabled { background: #efd9b9; transform: translateY(-1px); }
button:focus-visible { outline: 3px solid #a74c28; outline-offset: 3px; }
button:disabled { opacity: .45; cursor: default; }
#toggle { color: #fff8ed; border-color: #843d25; background: #95482c; }
#toggle:hover { background: #77351f; }
#records { margin-top: 30px; max-height: 230px; overflow: auto; }
table { width: 100%; border-collapse: collapse; font-size: .875rem; font-variant-numeric: tabular-nums; }
caption { text-align: left; font-weight: 700; padding-bottom: 12px; }
th, td { padding: 10px 3px; text-align: right; border-bottom: 1px solid #dcc8a9; }
th:first-child { text-align: left; }
thead { color: #805b42; }
@media (prefers-reduced-motion: reduce) { .leaf { animation: none; display: none; } button { transition: none; } }
</style>
</head>
<body>
<div class="landscape" aria-hidden="true">
<div class="sun"></div><div class="hill back"></div><div class="hill"></div>
<div class="tree"></div><div class="tree right"></div>
<i class="leaf" style="--left:12%;--color:#c86727;--duration:17s;--delay:-4s"></i>
<i class="leaf" style="--left:29%;--color:#b44a22;--duration:21s;--delay:-12s"></i>
<i class="leaf" style="--left:48%;--color:#d39531;--duration:19s;--delay:-7s"></i>
<i class="leaf" style="--left:66%;--color:#ad4c24;--duration:23s;--delay:-18s"></i>
<i class="leaf" style="--left:85%;--color:#d38b27;--duration:18s;--delay:-10s"></i>
</div>
<main>
<h1>가을의 시간</h1>
<p class="subtitle">낙엽이 머무는 풍경 속, 나만의 스톱워치</p>
<p id="time" role="timer" aria-label="경과 시간"><span id="whole">00:00:00</span><span id="fraction">.00</span></p>
<div class="controls">
<button id="toggle" type="button">시작</button>
<button id="lap" type="button" disabled>랩</button>
<button id="reset" type="button" disabled>초기화</button>
</div>
<div id="records" hidden>
<table><caption>랩 기록</caption><thead><tr><th scope="col">랩</th><th scope="col">구간 시간</th><th scope="col">누적 시간</th></tr></thead><tbody id="laps"></tbody></table>
</div>
</main>
<script>
const whole = document.getElementById('whole');
const fraction = document.getElementById('fraction');
const toggle = document.getElementById('toggle');
const lap = document.getElementById('lap');
const reset = document.getElementById('reset');
const records = document.getElementById('records');
const laps = document.getElementById('laps');
    let startedAt = null;
    let elapsed = 0;
    let frame;
    let previousLap = 0;
    let lapCount = 0;

    const pad = value => String(value).padStart(2, '0');
    const currentElapsed = () => elapsed + (startedAt === null ? 0 : performance.now() - startedAt);

    function format(ms) {
      const centiseconds = Math.floor(ms / 10);
      const seconds = Math.floor(centiseconds / 100);
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor(seconds / 60) % 60;
      return [pad(hours), pad(minutes), pad(seconds % 60)].join(':') + '.' + pad(centiseconds % 100);
    }

    function render() {
      const ms = currentElapsed();
      const [time, decimals] = format(ms).split('.');
      if (whole.textContent !== time) whole.textContent = time;
      if (fraction.textContent !== '.' + decimals) fraction.textContent = '.' + decimals;
      if (startedAt !== null) frame = requestAnimationFrame(render);
    }

    toggle.addEventListener('click', () => {
      if (startedAt === null) {
        startedAt = performance.now();
        toggle.textContent = '일시정지';
        lap.disabled = false;
        reset.disabled = false;
      } else {
        elapsed = currentElapsed();
        startedAt = null;
        cancelAnimationFrame(frame);
        toggle.textContent = '계속';
        lap.disabled = true;
      }
      render();
    });

    lap.addEventListener('click', () => {
      const total = currentElapsed();
      const row = laps.insertRow(0);
      const number = document.createElement('th');
      number.scope = 'row';
      number.textContent = ++lapCount;
      row.append(number);
      row.insertCell().textContent = format(total - previousLap);
      row.insertCell().textContent = format(total);
      previousLap = total;
      records.hidden = false;
    });

    reset.addEventListener('click', () => {
      startedAt = null;
      cancelAnimationFrame(frame);
      elapsed = 0;
      previousLap = 0;
      lapCount = 0;
      laps.replaceChildren();
      records.hidden = true;
      toggle.textContent = '시작';
      toggle.focus();
      lap.disabled = true;
      reset.disabled = true;
      render();
    });


render();
</script>
</body>
</html>
